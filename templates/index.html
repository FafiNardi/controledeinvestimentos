<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carteira • Rebalanceamento Dinâmico</title>
<script>if(localStorage.getItem('tema')==='light') document.documentElement.setAttribute('data-theme','light');</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#0a0f16; --panel:#131b25; --panel2:#1b2532; --line:#26313f;
    --txt:#e9eef4; --muted:#8ca0b3; --accent:#2dd4bf; --blue:#5b8def;
    --green:#34d399; --red:#f87171; --amber:#f5b754;
    --page-a:var(--blue); --page-b:var(--accent); --tab-txt-on:#04141c;
  }
  html[data-theme="light"]{
    --bg:#f2f4f7; --panel:#ffffff; --panel2:#eaeef3; --line:#d7dee6;
    --txt:#16202b; --muted:#5b6b7c; --accent:#0f9d8c; --blue:#3b66d1;
    --green:#16a34a; --red:#dc2626; --amber:#b45309;
    --tab-txt-on:#fff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Manrope',-apple-system,Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--txt);font-size:13.5px}
  .stat .v,td,td input{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;
       font-variant-numeric:tabular-nums}
  select,input{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
             border-radius:7px;padding:6px 8px;font-size:13px;font-family:inherit}
  .selcart{padding:7px 10px;font-size:13px;max-width:260px}
  button{background:var(--blue);color:#fff;border:0;border-radius:7px;
         padding:8px 14px;font-size:13px;cursor:pointer;font-weight:700;font-family:inherit}
  button:hover{filter:brightness(1.1)}
  button.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .ro-badge{background:rgba(245,158,11,.15);color:var(--amber);padding:4px 10px;
            border-radius:20px;font-size:11px;font-weight:700}

  /* ---- Cabeçalho em duas camadas: barra principal (marca fixa + navegação entre as
     3 páginas + tema/usuário) sempre com o mesmo conteúdo enxuto, então nunca estoura;
     barra de contexto abaixo, com fundo levemente diferente, pro que muda de página
     pra página (carteira, moeda, cotações). Sem overflow-x — quando o espaço aperta, as
     duas linhas quebram de forma previsível em vez de empurrar botão pra fora da tela. */
  .topbar{background:var(--panel);border-bottom:1px solid var(--line)}
  .topbar-row{display:flex;align-items:center;gap:10px;padding:11px 24px;flex-wrap:wrap}
  .topbar-row.context{background:var(--panel2);border-top:1px solid var(--line);
                       padding:10px 24px;row-gap:8px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;color:var(--txt);
         letter-spacing:-.01em;flex-shrink:0}
  .brand .mark{width:22px;height:22px;border-radius:7px;flex-shrink:0;
               background:linear-gradient(135deg,var(--page-a),var(--page-b))}
  .tabs-nav{display:flex;flex-wrap:wrap;gap:2px;background:var(--bg);padding:3px;border-radius:10px;
            border:1px solid var(--line)}
  .tab-link{background:none;border:0;color:var(--muted);padding:7px 13px;border-radius:7px;
            font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;
            display:flex;align-items:center;gap:6px;white-space:nowrap}
  .tab-link:hover:not(.on){background:var(--panel2);color:var(--txt)}
  .tab-link.on{background:var(--page-a);color:var(--tab-txt-on);cursor:default}
  .topbar-spacer{flex:1;min-width:4px}
  .icon-btn{width:32px;height:32px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);
            color:var(--txt);display:flex;align-items:center;justify-content:center;cursor:pointer;
            font-size:14px;flex-shrink:0}
  .icon-btn:hover{background:var(--bg)}
  .user-chip{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;padding:6px 12px;
             border-radius:20px;background:var(--panel2);border:1px solid var(--line);flex-shrink:0;
             white-space:nowrap}
  .user-chip a{color:var(--muted);text-decoration:none;font-weight:700}
  .user-chip a:hover{color:var(--red)}
  .ctx-label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:700;
             flex-shrink:0}
  .ctx-label select,.ctx-label input{font-size:13px}
  .ctx-divider{width:1px;align-self:stretch;background:var(--line);margin:0 2px;flex-shrink:0}

  .stats{display:flex;gap:10px;padding:20px 24px 14px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;
        padding:10px 14px;min-width:150px;flex:1}
  .stat .k{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .stat .v{font-size:19px;font-weight:700;margin-top:5px}
  .toolbar{display:flex;align-items:center;gap:14px;padding:6px 24px 16px;flex-wrap:wrap}
  .toolbar label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
  .wrap{padding:0 24px 60px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:600;
     font-size:11px;text-transform:uppercase;letter-spacing:.3px;z-index:2}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--txt)}
  th .arr{color:var(--accent);font-size:10px}
  .pct-cell{width:64px}
  .pct-inp{text-align:right}
  td:first-child,th:first-child{text-align:left}
  tr:hover td{background:rgba(255,255,255,.03)}
  .tick{font-weight:700;color:var(--accent)}
  td input,td select{background:transparent;border:1px solid transparent;color:var(--txt);
    text-align:right;width:100%;padding:4px;border-radius:5px;font-size:12.5px}
  td input:hover,td select:hover{border-color:var(--line)}
  td input:focus,td select:focus{border-color:var(--blue);background:var(--panel2);outline:0}
  td input:disabled,td select:disabled{border-color:transparent !important;color:var(--txt);
    -webkit-appearance:none;appearance:none;opacity:1}
  td select{text-align:left;cursor:pointer}
  td select option{background:var(--panel2)}
  .badge{padding:3px 10px;border-radius:20px;font-weight:700;font-size:11px}
  .buy{background:rgba(34,197,94,.15);color:var(--green)}
  .wait{background:rgba(245,158,11,.12);color:var(--amber)}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .del{color:var(--red);cursor:pointer;background:none;padding:2px 6px;font-size:15px}
  .addrow td{background:var(--panel2)}
  .muted{color:var(--muted)}
  #status{font-size:12px;color:var(--muted);margin-left:8px}
  .spin{display:inline-block;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-row">
    <div class="brand"><span class="mark"></span>Rebalanceamento</div>
    <nav class="tabs-nav">
      <button class="tab-link" onclick="location.href='/rentabilidade'">📈 Rentabilidade</button>
      <button class="tab-link" onclick="location.href='/opcoes'">🎯 Opções</button>
      <button class="tab-link on">📊 Rebalanceamento</button>
    </nav>
    <div class="topbar-spacer"></div>
    <button class="icon-btn" id="btnTema" onclick="toggleTema()" title="Alternar tema claro/escuro">🌙</button>
    <div class="user-chip">👤 {{ usuario }} · <a href="{{ url_for('logout') }}">sair</a></div>
  </div>
  <div class="topbar-row context">
    <label class="ctx-label">Carteira
      <select id="selCarteira" class="selcart" onchange="trocarCarteira()"></select>
    </label>
    <button class="ghost" id="btnRenomear" onclick="renomearCarteira()" title="Renomear carteira">✎</button>
    <span id="roBadge"></span>
    <div class="ctx-divider"></div>
    <label class="ctx-label">Moeda
      <select id="selMoeda" onchange="saveMoeda()">
        <option value="BRL">R$ Real</option>
        <option value="USD">US$ Dólar</option>
      </select>
    </label>
    <label class="ctx-label">Carteira ideal
      <input id="carteiraIdeal" type="text" onchange="saveConfig()"
             onfocus="this.select()" placeholder="R$ 0.00" style="width:130px">
    </label>
    <button class="ghost" onclick="refresh()" id="btnRefresh">⟳ Atualizar cotações</button>
    <span id="status" class="muted"></span>
    <div class="topbar-spacer"></div>
    <button class="ghost" onclick="novaCarteira()">+ Nova carteira</button>
    <button class="ghost" id="btnDelCart" style="display:none;color:var(--red);border-color:var(--red)" onclick="deletarCarteira()">🗑 Excluir carteira</button>
  </div>
</header>

<div class="stats" id="stats"></div>

<div class="toolbar">
  <label>Classe:
    <select id="filtroClasse" onchange="renderRows()">
      <option value="">Todas</option>
    </select>
  </label>
  <span id="filtroInfo" class="muted"></span>
  <button class="ghost" id="btnCopiarRent" onclick="copiarDaRentabilidade()" style="margin-left:auto"
    title="Traz pra cá os ativos já cadastrados na Rentabilidade dessa carteira">📈→⚖️ Copiar da Rentabilidade</button>
  <span id="statusCopiar" class="muted"></span>
  <button class="ghost" onclick="limparOrdem()">↕ Limpar ordenação</button>
</div>

<div class="wrap">
  <table>
    <thead>
      <tr>
        <th class="sortable" data-sort="ticker">Ativo</th>
        <th class="sortable" data-sort="preco">Preço</th>
        <th class="sortable" data-sort="vpa">Val. Patr.</th>
        <th class="sortable" data-sort="pvp">P/VP</th>
        <th class="sortable" data-sort="dy">DY 12m</th>
        <th class="sortable" data-sort="num_acoes">Qtd.</th>
        <th class="sortable" data-sort="preco_medio">Preço Médio</th>
        <th class="sortable" data-sort="rentabilidade">Rentab.</th>
        <th class="sortable" data-sort="classe">Classe</th>
        <th class="sortable" data-sort="segmento">Segmento</th>
        <th class="sortable" data-sort="tenho">Tenho R$</th>
        <th class="sortable pct-cell" data-sort="pct_ideal">% Ideal</th>
        <th class="sortable" data-sort="pct_tenho">% Tenho</th>
        <th class="sortable" data-sort="quero">Quero R$</th>
        <th class="sortable" data-sort="falta">Falta R$</th>
        <th class="sortable" data-sort="decisao">Ação</th>
        <th class="sortable" data-sort="qtd_cotas">Cotas p/comprar</th><th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
    <tfoot id="addfoot">
      <tr class="addrow">
        <td><input id="newTicker" placeholder="+ Ticker (ex: ITUB4)" style="text-align:left"></td>
        <td colspan="4" class="muted" style="text-align:left">Renda fixa? digite um nome e edite o preço manualmente</td>
        <td><input id="newQtd" type="number" placeholder="Qtd" style="text-align:left"></td>
        <td><input id="newPM" type="number" placeholder="Preço médio" style="text-align:left"></td>
        <td></td>
        <td><select id="newClasse"></select></td>
        <td><select id="newSeg"></select></td>
        <td></td>
        <td><input id="newPct" type="number" placeholder="% ideal" style="text-align:left"></td>
        <td colspan="4"></td>
        <td><button onclick="addAsset()">Adicionar</button></td>
      </tr>
    </tfoot>
  </table>
</div>

<script>
const CLASSES_BRL = ["Ação", "BDR", "Cripto", "ETF", "FII", "FII Infra", "Renda Fixa"]
  .sort((a,b)=>a.localeCompare(b,'pt-BR'));
const CLASSES_USD = ["Bond", "Cash", "ETF", "REIT", "Stocks"]
  .sort((a,b)=>a.localeCompare(b,'pt-BR'));
const CLASSE_BRL_TO_USD = {"Renda Fixa":"Bond", "FII":"REIT", "Ação":"Stocks", "ETF":"ETF"};
const CLASSE_USD_TO_BRL = {"Bond":"Renda Fixa", "REIT":"FII", "Stocks":"Ação", "ETF":"ETF"};
function classesAtuais(){ return ["", ...(MOEDA==='USD'?CLASSES_USD:CLASSES_BRL)]; }
const SEGMENTOS = ["", "Elétrica", "Bancos", "Fdo. de Inv.", "Fundo de Fundos",
  "Logística", "Construtora", "Celulose", "Renda Fixa", "Shopping", "Imóveis",
  "Tesouro Direto", "Financeira", "Lajes Corp.", "Papel", "Híbrido", "Petróleo",
  "Seguradora", "Saneamento", "Agrícola", "Mineração", "Telecomunicação", "Outro"];

let MOEDA = 'BRL';
const BRL = v => (MOEDA==='USD'?'US$ ':'R$ ') + (v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const NUM = (v,d=2) => (v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtUS = v => (MOEDA==='USD'?'US$ ':'R$ ') + (v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtPct = v => (v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) + '%';
function smartNum(s){
  s = String(s).replace(/[^\d.,-]/g,'');
  if(s.includes(',') && s.includes('.')){
    s = (s.lastIndexOf(',') > s.lastIndexOf('.'))
      ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  } else if(s.includes(',')){ s = s.replace(',','.'); }
  return parseFloat(s) || 0;
}
function fillSelect(sel, opts, val){
  sel.innerHTML = opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('');
}
function fillSelectClasse(sel, val){
  const lista = classesAtuais();
  const opcoes = (!val || lista.includes(val)) ? lista : [...lista, val];
  fillSelect(sel, opcoes, val);
}

let STATE = {assets:[]};
let CARTEIRAS = [];
let CID = null;            // carteira selecionada
let EDIT = false;          // posso editar a carteira atual?
let SORT = {field:null, dir:1};

async function carregarCarteiras(){
  const r = await fetch('/api/carteiras'); const d = await r.json();
  CARTEIRAS = d.carteiras;
  const sel = document.getElementById('selCarteira');
  if(!CARTEIRAS.length){ sel.innerHTML = '<option>— crie sua primeira carteira —</option>'; STATE={assets:[]}; CID=null; renderTudo(); return; }
  sel.innerHTML = CARTEIRAS.map(c=>{
    const tag = c.minha ? '' : ' · '+c.dono;
    return `<option value="${c.id}">${c.nome}${tag}${c.minha?'  (minha)':''}</option>`;
  }).join('');
  // mantém seleção atual, senão a última usada (compartilhada com a página de Rentabilidade),
  // senão a primeira "minha"
  if(!CID || !CARTEIRAS.find(c=>c.id===CID)){
    const salva = parseInt(localStorage.getItem('ultimaCarteiraId'));
    const existeSalva = CARTEIRAS.find(c=>c.id===salva);
    const minha = CARTEIRAS.find(c=>c.minha);
    CID = existeSalva ? salva : (minha || CARTEIRAS[0]).id;
  }
  sel.value = CID;
  localStorage.setItem('ultimaCarteiraId', CID);
  await load();
}

async function trocarCarteira(){
  CID = parseInt(document.getElementById('selCarteira').value)||null;
  if(CID) localStorage.setItem('ultimaCarteiraId', CID);
  await load();
}

async function novaCarteira(){
  const nome = prompt('Nome da nova carteira (ex.: "Carteira do Rafael", "Aposentadoria"):');
  if(!nome) return;
  const r = await fetch('/api/carteiras',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({nome})});
  const d = await r.json();
  if(d.id){ CID = d.id; }
  carregarCarteiras();
}

async function load(){
  if(!CID){ renderTudo(); return; }
  const r = await fetch('/api/carteira/'+CID+'/state');
  if(!r.ok){ return; }
  STATE = await r.json();
  EDIT = STATE.carteira.editavel;
  MOEDA = STATE.carteira.moeda || 'BRL';
  document.getElementById('selMoeda').value = MOEDA;
  fillSelectClasse(document.getElementById('newClasse'), '');
  document.getElementById('carteiraIdeal').placeholder = MOEDA==='USD' ? 'US$ 0.00' : 'R$ 0.00';
  document.getElementById('carteiraIdeal').value = STATE.carteira.carteira_ideal ? fmtUS(STATE.carteira.carteira_ideal) : '';
  document.getElementById('carteiraIdeal').disabled = !EDIT;
  document.getElementById('roBadge').innerHTML = EDIT ? '' :
     `<span class="ro-badge">👁 Somente leitura · de ${STATE.carteira.dono}</span>`;
  document.getElementById('addfoot').style.display = EDIT ? '' : 'none';
  document.getElementById('btnCopiarRent').style.display = EDIT ? '' : 'none';
  document.getElementById('btnDelCart').style.display = EDIT ? '' : 'none';
  document.getElementById('btnRenomear').style.display = EDIT ? '' : 'none';
  renderTudo();
}

function renderTudo(){ popularFiltroClasse(); renderStats(); renderRows(); }

function popularFiltroClasse(){
  const sel = document.getElementById('filtroClasse');
  const atual = sel.value;
  const classes = [...new Set(STATE.assets.map(a=>a.classe).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">Todas</option>' +
    classes.map(c=>`<option ${c===atual?'selected':''}>${c}</option>`).join('');
}

function renderStats(){
  const s = STATE; const ci = s.carteira ? s.carteira.carteira_ideal : 0;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="k">Carteira Ideal</div><div class="v">${BRL(ci)}</div></div>
    <div class="stat"><div class="k">Total Investido</div><div class="v">${BRL(s.total_tenho)}</div></div>
    <div class="stat"><div class="k">Falta aportar</div><div class="v">${BRL(Math.max(ci-(s.total_tenho||0),0))}</div></div>
    <div class="stat"><div class="k">% Ideal somado</div><div class="v" style="color:${Math.abs((s.pct_ideal_total||0)-100)<0.5?'var(--green)':'var(--amber)'}">${NUM(s.pct_ideal_total||0)}%</div></div>
  `;
}

function setSort(f){ if(SORT.field===f){SORT.dir*=-1;}else{SORT.field=f;SORT.dir=1;} renderRows(); }
function limparOrdem(){ SORT={field:null,dir:1}; renderRows(); }

function viewAssets(){
  const fc = document.getElementById('filtroClasse').value;
  let arr = STATE.assets.filter(a => !fc || a.classe === fc);
  if(SORT.field){
    const f = SORT.field;
    arr = [...arr].sort((a,b)=>{
      let x=a[f], y=b[f];
      if(typeof x==='string' || typeof y==='string'){
        x=(x||'').toString().toLowerCase(); y=(y||'').toString().toLowerCase();
        return x<y?-SORT.dir : x>y?SORT.dir : 0;
      }
      return ((x||0)-(y||0))*SORT.dir;
    });
  }
  return arr;
}

function renderRows(){
  const tb = document.getElementById('rows');
  const dados = viewAssets();
  const dis = EDIT ? '' : 'disabled';
  document.querySelectorAll('th.sortable').forEach(th=>{
    const base = th.dataset.label || (th.dataset.label = th.textContent);
    th.innerHTML = base + (SORT.field===th.dataset.sort
      ? ` <span class="arr">${SORT.dir>0?'▲':'▼'}</span>` : '');
  });
  document.getElementById('filtroInfo').textContent = `${dados.length} de ${STATE.assets.length} ativos`;
  if(CID && EDIT && STATE.assets.length===0){
    tb.innerHTML = `<tr><td colspan="18" style="text-align:center;padding:26px;color:var(--muted)">
      Carteira vazia — adicione seu primeiro ativo na linha abaixo.</td></tr>`;
    return;
  }
  tb.innerHTML = dados.map(a=>{
    const buy = a.decisao==='Comprar';
    return `<tr data-id="${a.id}">
      <td><span class="tick">${a.ticker}</span>${a.manual?' <span class="muted">✎</span>':''}</td>
      <td>${a.manual
            ? `<input type="text" value="${a.preco?BRL(a.preco):''}" placeholder="${MOEDA==='USD'?'US$ 0,00':'R$ 0,00'}" ${dis} onfocus="this.select()" onchange="upd(${a.id},'preco',smartNum(this.value))">`
            : BRL(a.preco)}</td>
      <td><input type="text" class="vpa-inp" value="${a.vpa?BRL(a.vpa):''}" placeholder="—" ${dis} onfocus="this.select()" onchange="updVpa(${a.id},this.value)"></td>
      <td class="muted">${a.pvp?NUM(a.pvp):'—'}</td>
      <td class="muted">${a.dy?NUM(a.dy)+'%':'—'}</td>
      <td><input type="number" step="0.0001" value="${a.num_acoes||''}" ${dis} onchange="upd(${a.id},'num_acoes',this.value)"></td>
      <td><input type="number" step="0.01" value="${a.preco_medio||''}" ${dis} onchange="upd(${a.id},'preco_medio',this.value)"></td>
      <td class="${a.rentabilidade>=0?'pos':'neg'}">${NUM(a.rentabilidade)}%</td>
      <td><select ${dis} onchange="upd(${a.id},'classe',this.value)" data-classe></select></td>
      <td><select ${dis} onchange="upd(${a.id},'segmento',this.value)" data-seg></select></td>
      <td>${BRL(a.tenho)}</td>
      <td class="pct-cell"><input type="text" class="pct-inp" value="${a.pct_ideal?fmtPct(a.pct_ideal):''}" ${dis} onfocus="this.select()" onchange="upd(${a.id},'pct_ideal',smartNum(this.value))"></td>
      <td>${NUM(a.pct_tenho)}%</td>
      <td>${BRL(a.quero)}</td>
      <td class="${a.falta>=0?'':'neg'}">${BRL(a.falta)}</td>
      <td><span class="badge ${buy?'buy':'wait'}">${a.decisao}</span></td>
      <td>${buy && a.qtd_cotas>0 ? '<b>'+a.qtd_cotas+'</b>' : '—'}</td>
      <td>${EDIT?`<button class="del" onclick="del(${a.id})">×</button>`:''}</td>
    </tr>`;
  }).join('');
  dados.forEach(a=>{
    const tr = tb.querySelector(`tr[data-id="${a.id}"]`);
    if(!tr) return;
    fillSelectClasse(tr.querySelector('[data-classe]'), a.classe);
    fillSelect(tr.querySelector('[data-seg]'), SEGMENTOS, a.segmento);
    if(!EDIT){ tr.querySelector('[data-classe]').disabled=true; tr.querySelector('[data-seg]').disabled=true; }
  });
}

// Salvamento otimista: o campo já mostra o que foi digitado (o navegador faz isso sozinho),
// o salvamento acontece em segundo plano (sem travar a digitação) e a tela só é sincronizada
// com o servidor (peso, decisão de compra, etc.) um tempo depois, com cuidado pra não atrapalhar
// quem ainda está digitando nem perder a posição de rolagem.
function upd(id, field, value){
  // keepalive garante que o salvamento termine mesmo se o usuário sair da página logo em seguida
  fetch('/api/assets/'+id, {method:'PUT',headers:{'Content-Type':'application/json'},keepalive:true,
    body: JSON.stringify({[field]: value})})
    .catch(()=>console.error('Falha ao salvar', field, id));
  agendarSincronizacao();
}
function updVpa(id, value){
  const num = smartNum(value);
  fetch('/api/assets/'+id, {method:'PUT',headers:{'Content-Type':'application/json'},keepalive:true,
    body: JSON.stringify({vpa: num, vpa_manual: num ? 1 : 0})})
    .catch(()=>console.error('Falha ao salvar vpa', id));
  agendarSincronizacao();
}
let _syncTimer = null;
function agendarSincronizacao(){
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(sincronizarEmSegundoPlano, 1500);
}
async function sincronizarEmSegundoPlano(){
  if(!CID) return;
  const r = await fetch('/api/carteira/'+CID+'/state');
  if(!r.ok) return;
  STATE = await r.json();
  EDIT = STATE.carteira.editavel;
  MOEDA = STATE.carteira.moeda || 'BRL';
  // esse trecho não tem campos de digitação, então pode ser atualizado sem risco
  renderStats();
  atualizarColunasCalculadas();
}
// O que o usuário digita (nº de ações, preço médio, VPA, % ideal) NUNCA é reescrito pelo
// servidor — o navegador já guarda o valor certo, não precisa de confirmação de ninguém.
// Só as colunas calculadas (tenho, % carteira, quero, falta, decisão, cotas) são atualizadas,
// célula por célula, sem tocar nos campos de digitação nem reconstruir a linha.
function atualizarColunasCalculadas(){
  const porId = {};
  STATE.assets.forEach(a=>{ porId[a.id] = a; });
  document.querySelectorAll('#rows tr[data-id]').forEach(tr=>{
    const a = porId[parseInt(tr.dataset.id)];
    if(!a) return;
    const tds = tr.querySelectorAll('td');
    if(tds[3]) tds[3].textContent = a.pvp?NUM(a.pvp):'—';
    if(tds[4]) tds[4].textContent = a.dy?NUM(a.dy)+'%':'—';
    if(tds[7]){ tds[7].className = a.rentabilidade>=0?'pos':'neg'; tds[7].textContent = NUM(a.rentabilidade)+'%'; }
    if(tds[10]) tds[10].textContent = BRL(a.tenho);
    if(tds[12]) tds[12].textContent = NUM(a.pct_tenho)+'%';
    if(tds[13]) tds[13].textContent = BRL(a.quero);
    if(tds[14]){ tds[14].className = a.falta>=0?'':'neg'; tds[14].textContent = BRL(a.falta); }
    if(tds[15]){ const buy = a.decisao==='Comprar'; tds[15].innerHTML = `<span class="badge ${buy?'buy':'wait'}">${a.decisao}</span>`; }
    if(tds[16]){ const buy = a.decisao==='Comprar'; tds[16].innerHTML = buy && a.qtd_cotas>0 ? '<b>'+a.qtd_cotas+'</b>' : '—'; }
  });
}
async function del(id){
  if(!confirm('Remover este ativo?')) return;
  await fetch('/api/assets/'+id, {method:'DELETE'}); await load();
}
async function saveConfig(){
  if(!CID) return;
  await fetch('/api/carteira/'+CID+'/config',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({carteira_ideal: smartNum(document.getElementById('carteiraIdeal').value)})});
  await load();
}
async function addAsset(){
  const ticker = document.getElementById('newTicker').value.trim();
  if(!ticker){ alert('Informe o ticker (ex: ITUB4) ou um nome para renda fixa.'); return; }
  const st=document.getElementById('status'); st.textContent='buscando cotação...';
  await fetch('/api/carteira/'+CID+'/assets',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      ticker, num_acoes:document.getElementById('newQtd').value,
      preco_medio: document.getElementById('newPM').value,
      pct_ideal: document.getElementById('newPct').value,
      classe: document.getElementById('newClasse').value,
      segmento: document.getElementById('newSeg').value
    })});
  ['newTicker','newQtd','newPM','newPct'].forEach(i=>document.getElementById(i).value='');
  st.textContent=''; await load();
}
async function saveMoeda(){
  if(!CID) return;
  const nova = document.getElementById('selMoeda').value;
  const mapa = nova==='USD' ? CLASSE_BRL_TO_USD : CLASSE_USD_TO_BRL;
  const traducoes = (STATE.assets||[])
    .filter(a => mapa[a.classe])
    .map(a => fetch('/api/assets/'+a.id,{method:'PUT',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({classe: mapa[a.classe]})}));
  await Promise.all(traducoes);
  MOEDA = nova;
  await fetch('/api/carteira/'+CID+'/config',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({moeda: MOEDA})});
  await load();
}
function toggleTema(){
  const claro = document.documentElement.getAttribute('data-theme')==='light';
  if(claro){ document.documentElement.removeAttribute('data-theme'); localStorage.setItem('tema','dark'); }
  else { document.documentElement.setAttribute('data-theme','light'); localStorage.setItem('tema','light'); }
  document.getElementById('btnTema').textContent = claro ? '🌙' : '☀️';
}
async function renomearCarteira(){
  if(!CID || !STATE.carteira) return;
  const novo = prompt('Novo nome da carteira:', STATE.carteira.nome);
  if(!novo || !novo.trim()) return;
  await fetch('/api/carteira/'+CID+'/config',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({nome: novo.trim()})});
  carregarCarteiras();
}
async function deletarCarteira(){
  const nome = STATE.carteira ? STATE.carteira.nome : 'esta carteira';
  if(!confirm(`Tem certeza que deseja EXCLUIR a carteira "${nome}" e todos os seus ativos?\n\nEssa ação não pode ser desfeita.`)) return;
  const r = await fetch('/api/carteira/'+CID, {method:'DELETE'});
  if(r.ok){ CID = null; carregarCarteiras(); }
  else { alert('Erro ao excluir carteira.'); }
}
// Copia pro Rebalanceamento os ativos já cadastrados na Rentabilidade dessa mesma carteira —
// evita ter que digitar um por um de novo; entram com classe copiada e % ideal em 0, pra você só
// preencher o percentual de cada um. Sempre como "manual" (sem buscar cotação sozinho), porque
// muitos nomes da Rentabilidade não são tickers de verdade (ex.: "Fundo DI", "IPCA + 2030") — se
// algum for um ticker de bolsa de verdade, dá pra tirar o "manual" depois e usar "Atualizar cotações".
async function copiarDaRentabilidade(){
  if(!CID || !EDIT) return;
  const r = await fetch('/api/carteira/'+CID+'/rent');
  if(!r.ok){ alert('Não consegui ler os ativos da Rentabilidade dessa carteira.'); return; }
  const rent = await r.json();
  const ativosRent = rent.ativos || [];
  if(!ativosRent.length){ alert('Essa carteira não tem nenhum ativo cadastrado na Rentabilidade ainda.'); return; }
  const jaTem = new Set(STATE.assets.map(a=>a.ticker.toUpperCase()));
  const faltando = ativosRent.filter(a => !jaTem.has(a.nome.trim().toUpperCase()));
  if(!faltando.length){ alert('Todos os ativos da Rentabilidade já estão no Rebalanceamento.'); return; }
  if(!confirm(`Copiar ${faltando.length} ativo(s) da Rentabilidade pro Rebalanceamento?\n\n`+
    faltando.map(a=>`• ${a.nome}${a.classe?' ('+a.classe+')':''}`).join('\n')+
    `\n\nEles entram com % ideal em 0 — você ajusta depois.`)) return;
  // feedback bem ao lado do botão (o #status lá do cabeçalho é longe demais — dava a impressão de
  // que nada tinha acontecido) + botão desabilitado enquanto roda, pra não dar duplo-clique
  const btn = document.getElementById('btnCopiarRent'), st = document.getElementById('statusCopiar');
  btn.disabled = true;
  st.textContent = `copiando ${faltando.length} ativo(s)...`;
  // em paralelo — são só inserções simples (manual:1 não busca cotação), não precisa ser sequencial
  await Promise.all(faltando.map(a =>
    fetch('/api/carteira/'+CID+'/assets',{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ticker: a.nome.trim(), classe: a.classe||'', manual:1})})));
  await load();
  btn.disabled = false;
  st.textContent = `✓ ${faltando.length} copiado(s)`;
  setTimeout(()=>{ if(st.textContent.startsWith('✓')) st.textContent=''; }, 5000);
}
async function refresh(){
  if(!CID) return;
  const b=document.getElementById('btnRefresh'), st=document.getElementById('status');
  b.disabled=true; st.innerHTML='<span class="spin">⟳</span> atualizando...';
  await fetch('/api/carteira/'+CID+'/refresh',{method:'POST'});
  b.disabled=false; st.textContent='atualizado '+new Date().toLocaleTimeString('pt-BR');
  await load();
}

fillSelectClasse(document.getElementById('newClasse'), '');
fillSelect(document.getElementById('newSeg'), SEGMENTOS, '');
document.querySelectorAll('th.sortable').forEach(th=>
  th.addEventListener('click', ()=> setSort(th.dataset.sort)));
document.getElementById('btnTema').textContent =
  document.documentElement.getAttribute('data-theme')==='light' ? '☀️' : '🌙';
carregarCarteiras();
</script>
