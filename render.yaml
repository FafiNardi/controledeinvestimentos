services:
  - type: web
    name: carteira-investimentos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true          # senha de sessão gerada automaticamente
      - key: DATABASE_URL
        fromDatabase:
          name: carteira-db
          property: connectionString

databases:
  - name: carteira-db
    plan: free
