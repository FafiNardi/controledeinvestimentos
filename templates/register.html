<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta • Carteira</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0f1419;color:#e6edf3;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  .card{background:#1a2230;border:1px solid #2c3a4f;border-radius:14px;padding:32px;width:330px}
  h1{font-size:20px;color:#2dd4bf;margin:0 0 6px}
  p.sub{color:#8a9bb0;margin:0 0 22px;font-size:13px}
  label{display:block;font-size:12px;color:#8a9bb0;margin:14px 0 5px}
  .inp-wrap{position:relative}
  input{width:100%;box-sizing:border-box;background:#212c3d;border:1px solid #2c3a4f;
        color:#e6edf3;border-radius:8px;padding:11px 40px 11px 11px;font-size:14px}
  .eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);
       cursor:pointer;color:#8a9bb0;font-size:16px;user-select:none;background:none;
       border:none;padding:0;line-height:1}
  .eye:hover{color:#e6edf3}
  button[type=submit]{width:100%;margin-top:22px;background:#22c55e;color:#fff;border:0;
         border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer}
  .alt{margin-top:16px;text-align:center;font-size:13px;color:#8a9bb0}
  a{color:#2dd4bf;text-decoration:none}
  .flash{background:rgba(239,68,68,.15);color:#f87171;padding:9px 12px;border-radius:8px;
         font-size:13px;margin-bottom:8px}
  .err{color:#f87171;font-size:12px;margin-top:4px;display:none}
</style></head><body>
<form class="card" method="post" onsubmit="return validar()">
  <h1>📊 Criar conta</h1>
  <p class="sub">Escolha seu nome de usuário e senha</p>
  {% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
  <label>Nome de usuário</label>
  <input name="nome" autofocus autocomplete="username">
  <label>Senha</label>
  <div class="inp-wrap">
    <input id="senha" name="senha" type="password" autocomplete="new-password" oninput="checaSenha()">
    <button type="button" class="eye" onclick="toggle('senha','olho1')" id="olho1">👁</button>
  </div>
  <label>Confirmar senha</label>
  <div class="inp-wrap">
    <input id="confirma" type="password" autocomplete="new-password" oninput="checaSenha()">
    <button type="button" class="eye" onclick="toggle('confirma','olho2')" id="olho2">👁</button>
  </div>
  <div class="err" id="errSenha">As senhas não coincidem.</div>
  <button type="submit">Criar conta e entrar</button>
  <div class="alt">Já tem conta? <a href="{{ url_for('login') }}">Entrar</a></div>
</form>
<script>
function toggle(id, btnId){
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  document.getElementById(btnId).textContent = inp.type === 'password' ? '👁' : '🙈';
}
function checaSenha(){
  const s = document.getElementById('senha').value;
  const c = document.getElementById('confirma').value;
  const err = document.getElementById('errSenha');
  err.style.display = (c && s !== c) ? 'block' : 'none';
}
function validar(){
  const s = document.getElementById('senha').value;
  const c = document.getElementById('confirma').value;
  if(s !== c){ document.getElementById('errSenha').style.display='block'; return false; }
  return true;
}
</script>
</body></html>
