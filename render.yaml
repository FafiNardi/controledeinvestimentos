services:
  - type: web
    name: carteira-investimentos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 90
    envVars:
      - key: SECRET_KEY
        generateValue: true          # senha de sessão gerada automaticamente
      - key: DATABASE_URL
        sync: false                  # banco no Neon (configurado manualmente no painel da Render)
