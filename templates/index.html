<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carteira • Rebalanceamento Dinâmico</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1a2230; --panel2:#212c3d; --line:#2c3a4f;
    --txt:#e6edf3; --muted:#8a9bb0; --accent:#2dd4bf; --blue:#3b82f6;
    --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--txt);font-size:13px}
  header{padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
         border-bottom:1px solid var(--line);background:var(--panel)}
  h1{font-size:18px;margin:0;color:var(--accent);font-weight:700}
  .cfg{display:flex;gap:16px;flex-wrap:wrap;margin-left:auto;align-items:center}
  .cfg label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:3px}
  .cfg input,.selcart{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
             border-radius:6px;padding:6px 8px;font-size:13px}
  .cfg input{width:150px}
  .selcart{padding:7px 10px;font-size:13px;max-width:280px}
  button{background:var(--blue);color:#fff;border:0;border-radius:6px;
         padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600}
  button:hover{filter:brightness(1.1)}
  button.ghost{background:var(--panel2);border:1px solid var(--line)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .userbox{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
  .userbox a{color:var(--accent);text-decoration:none}
  .ro-badge{background:rgba(245,158,11,.15);color:var(--amber);padding:4px 10px;
            border-radius:20px;font-size:11px;font-weight:700}
  .stats{display:flex;gap:14px;padding:12px 24px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;
        padding:10px 16px;min-width:150px}
  .stat .k{font-size:11px;color:var(--muted)}
  .stat .v{font-size:18px;font-weight:700;margin-top:2px}
  .toolbar{display:flex;align-items:center;gap:14px;padding:6px 24px 12px}
  .toolbar label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
  .toolbar select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
                  border-radius:6px;padding:6px 8px;font-size:13px}
  .wrap{padding:0 16px 60px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:600;
     font-size:11px;text-transform:uppercase;letter-spacing:.3px;z-index:2}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--txt)}
  th .arr{color:var(--accent);font-size:10px}
  .pct-cell{width:64px}
  .pct-inp{text-align:right}
  td:first-child,th:first-child{text-align:left}
  tr:hover td{background:rgba(255,255,255,.03)}
  .tick{font-weight:700;color:var(--accent)}
  td input,td select{background:transparent;border:1px solid transparent;color:var(--txt);
    text-align:right;width:100%;padding:4px;border-radius:5px;font-size:12.5px}
  td input:hover,td select:hover{border-color:var(--line)}
